<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たんいぶんすう クイズ！</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background-color: #eef9ff;
    text-align: center;
    padding: 20px;
    margin: 0;
  }
  .container {
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 550px;
    margin: 0 auto;
    padding: 25px;
    border: 4px solid #4ecdc4;
  }
  h1 {
    color: #ff6b6b;
    font-size: 24px;
    margin-top: 0;
  }
  .progress {
    font-size: 16px;
    color: #666;
    margin-bottom: 15px;
    font-weight: bold;
  }
  /* テープ図のスタイル */
  .tape-container {
    margin: 25px 0;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 12px;
  }
  .tape-label {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
    text-align: left;
  }
  .tape {
    display: flex;
    width: 100%;
    height: 60px;
    border: 3px solid #333;
    border-radius: 8px;
    overflow: hidden;
    background: #e0e0e0;
  }
  .tape-part {
    flex: 1;
    border-right: 2px dashed #888;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: #666;
    transition: all 0.3s;
  }
  .tape-part:last-child {
    border-right: none;
  }
  .tape-part.active {
    background-color: #ffd166;
    color: #d00000;
  }

  /* 問題文と分数表示 */
  .question-box {
    font-size: 22px;
    margin: 20px 0;
    font-weight: bold;
    line-height: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .blank {
    display: inline-block;
    width: 60px;
    height: 45px;
    border: 3px dashed #ff6b6b;
    border-radius: 8px;
    color: #ff6b6b;
    font-size: 28px;
    line-height: 40px;
    text-align: center;
    background: #fff0f0;
  }
  .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    font-size: 18px;
    text-align: center;
    line-height: 1.1;
    margin: 0 4px;
  }
  .frac .top { border-bottom: 2px solid #333; padding: 0 4px; }
  .frac .bottom { padding: 0 4px; }

  /* 選択肢ボタン */
  .choices {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
  }
  .btn-choice {
    background-color: #4ecdc4;
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 24px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px #3bbaa0;
    font-weight: bold;
    min-width: 80px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-choice:active {
    transform: translateY(4px);
    box-shadow: 0 1px #3bbaa0;
  }

  /* 結果表示 */
  .result {
    font-size: 28px;
    height: 45px;
    margin-top: 15px;
    font-weight: bold;
  }
  .btn-next {
    background-color: #ff6b6b;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 20px;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px #d9534f;
    font-weight: bold;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>ぶんすう クイズ 🧩</h1>
  <div class="progress" id="progress">だい 1 もん / 5 もん</div>

  <div class="tape-container">
    <div class="tape-label">１ｍの テープ：</div>
    <div class="tape" id="tape"></div>
  </div>

  <div class="question-box" id="question"></div>

  <div class="choices" id="choices"></div>

  <div class="result" id="result"></div>
  <button class="btn-next" id="btn-next" onclick="nextQuestion()">つぎの問題へ ➔</button>
</div>

<script>
// Web Audio API による効果音生成
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } else {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }
}

// 分数HTMLをつくる関数
function makeFracHTML(num, den) {
  return `<span class="frac"><span class="top">${num}</span><span class="bottom">${den}</span></span>`;
}

// 問題データ
const quizData = [
  {
    totalParts: 3,
    activeParts: 2,
    // 「 1/3 が [ ? ] 個で 2/3 」
    questionText: (unitFrac, targetFrac) => `${unitFrac} が <span class="blank">?</span> 個で ${targetFrac}`,
    answer: "2",
    choices: ["1", "2", "3", "4"]
  },
  {
    totalParts: 4,
    activeParts: 3,
    // 「 1/4 が 3 個で [ ? ] 」
    questionText: (unitFrac, targetFrac) => `${unitFrac} が 3 個で <span class="blank">?</span>`,
    answer: "3/4",
    choices: ["1/4", "2/4", "3/4", "4/4"]
  },
  {
    totalParts: 5,
    activeParts: 4,
    // 「 4/5 は 1/5 が [ ? ] 個 」
    questionText: (unitFrac, targetFrac) => `${targetFrac} は ${unitFrac} が <span class="blank">?</span> 個`,
    answer: "4",
    choices: ["2", "3", "4", "5"]
  },
  {
    totalParts: 6,
    activeParts: 5,
    // 「 1/6 が [ ? ] 個あつまると 5/6 」
    questionText: (unitFrac, targetFrac) => `${unitFrac} が <span class="blank">?</span> 個あつまると ${targetFrac}`,
    answer: "5",
    choices: ["3", "4", "5", "6"]
  },
  {
    totalParts: 3,
    activeParts: 3,
    // 「 1/3 が 3 個で 1（ 3/3 ）」
    questionText: (unitFrac, targetFrac) => `${unitFrac} が 3 個で <span class="blank">?</span>`,
    answer: "3/3",
    choices: ["1/3", "2/3", "3/3"]
  }
];

let currentIdx = 0;

function loadQuestion() {
  const q = quizData[currentIdx];
  document.getElementById('progress').textContent = `だい ${currentIdx + 1} もん / ${quizData.length} もん`;
  document.getElementById('result').textContent = "";
  document.getElementById('btn-next').style.display = "none";

  // テープ図を描画
  const tapeEl = document.getElementById('tape');
  tapeEl.innerHTML = '';
  for (let i = 0; i < q.totalParts; i++) {
    const part = document.createElement('div');
    part.className = 'tape-part' + (i < q.activeParts ? ' active' : '');
    part.innerHTML = makeFracHTML(1, q.totalParts);
    tapeEl.appendChild(part);
  }

  // 問題文の作成
  const unitFracHTML = makeFracHTML(1, q.totalParts);
  const targetFracHTML = makeFracHTML(q.activeParts, q.totalParts);
  document.getElementById('question').innerHTML = q.questionText(unitFracHTML, targetFracHTML);

  // 選択肢ボタンを作成
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice';
    
    // 分数表記かどうか判定
    if (choice.includes('/')) {
      const [n, d] = choice.split('/');
      btn.innerHTML = makeFracHTML(n, d);
    } else {
      btn.textContent = choice;
    }

    btn.onclick = () => checkAnswer(choice, q.answer);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(selected, correct) {
  const resultEl = document.getElementById('result');
  if (selected === correct) {
    playSound('correct');
    resultEl.textContent = "⭕️ せいかい！";
    resultEl.style.color = "#2a9d8f";
    
    // ボタンを無効化して「次へ」を表示
    const btns = document.querySelectorAll('.btn-choice');
    btns.forEach(b => b.disabled = true);
    document.getElementById('btn-next').style.display = "inline-block";
  } else {
    playSound('incorrect');
    resultEl.textContent = "❌ おしい！ もういちど！";
    resultEl.style.color = "#e76f51";
  }
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizData.length) {
    document.getElementById('progress').textContent = "全問クリア！🎉";
    document.getElementById('question').innerHTML = "よく がんばりました！<br>たんいぶんすう マスターです！✨";
    document.getElementById('choices').innerHTML = '';
    document.getElementById('result').textContent = '';
    document.getElementById('btn-next').textContent = "もう一度あそぶ 🔄";
    document.getElementById('btn-next').onclick = () => {
      currentIdx = 0;
      document.getElementById('btn-next').textContent = "つぎの問題へ ➔";
      loadQuestion();
    };
  } else {
    loadQuestion();
  }
}

// 初期化
loadQuestion();
</script>
</body>
</html>
